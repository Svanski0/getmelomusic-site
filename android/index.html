<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>melo for Android</title>
<meta name="description" content="Melo for Android is coming to Google Play.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root { --fg:#fff; --dim:rgba(255,255,255,.55); --line:rgba(255,255,255,.16); --card:#060606; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { background:#000; color:var(--fg); }
  body { font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, system-ui, sans-serif;
         -webkit-font-smoothing:antialiased; min-height:100vh; min-height:100svh; display:flex; flex-direction:column; }
  a { color:inherit; text-decoration:none; }
  header { display:flex; justify-content:space-between; align-items:center; padding:22px 28px; }
  .wordmark { height:30px; display:block; }
  .pill { display:inline-flex; align-items:center; justify-content:center; gap:10px; border-radius:999px; font-weight:700; font-size:15px; padding:11px 20px; transition:transform .15s, background .2s; }
  .pill.line { border:1px solid var(--line); font-weight:600; }
  .pill.line:hover { background:rgba(255,255,255,.06); }
  main { flex:1; max-width:640px; width:100%; margin:0 auto; padding:24px 28px 48px; }
  .mark { width:56px; margin-bottom:26px; display:block; }
  h1 { font-weight:800; font-size:clamp(40px, 6vw, 64px); line-height:1.03; letter-spacing:-.035em; }
  .sub { margin-top:16px; font-size:18px; line-height:1.45; color:var(--dim); }
  footer { display:flex; justify-content:space-between; padding:22px 28px; color:var(--dim); font-size:13px; }
  footer nav { display:flex; gap:18px; flex-wrap:wrap; }
  footer a:hover { color:var(--fg); }
  @media (max-width:820px) {
    header { padding:16px; }
    .wordmark { height:24px; }
    main { padding:20px 16px 32px; }
    footer { flex-direction:column-reverse; gap:10px; align-items:center; padding:20px 16px 28px; }
  }
</style>
</head>
<body>
<header>
  <a href="/" aria-label="melo home"><img class="wordmark" src="/assets/melo-wordmark-white.png" alt="melo"></a>
  <a class="pill line" href="https://discord.gg/9V9xTb5YP">Join the Discord</a>
</header>

<main>
  <img class="mark" src="/assets/melo-mark-white.png" alt="">
  <h1>melo for Android</h1>
  <p class="sub">Coming to Google Play. Join the Discord for launch updates.</p>
</main>

<footer>
  <span>© 2026 melo</span>
  <nav>
    <a href="/">Home</a>
    <a href="https://discord.gg/9V9xTb5YP">Discord</a>
    <a href="/privacy/">Privacy</a>
    <a href="/terms/">Terms</a>
    <a href="mailto:support@getmelomusic.app">Support</a>
  </nav>
</footer>
</body>
</html>
